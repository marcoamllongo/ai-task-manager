spring:
  application:
    name: ai-task-manager

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aitaskmanager}
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

    ai:
      openai:
        api-key: ${OPENAI_API_KEY}
        chat:
          model: gpt-5-mini